version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: khoi/rag-frontend:latest
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://app:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: khoi/rag-agent:latest
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      vector-search:
        condition: service_healthy
      web-search:
        condition: service_healthy
      postgres:                    
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    env_file: .env
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  vector-search:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    image: khoi/rag-agent-mcp:latest
    command: python vector_search.py
    ports:
      - "8010:8010"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  web-search:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    image: khoi/rag-agent-mcp:latest
    command: python web_search.py
    ports:
      - "8011:8011"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  reranker:
    build:
      context: ./services/reranker
      dockerfile: Dockerfile
    image: khoi/reranker:latest
    ports:
      - "8002:8002"
    environment:
      - USE_FP16=true
    volumes:
      - model_cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    profiles: ["gpu"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  model_cache:
  postgres_data: